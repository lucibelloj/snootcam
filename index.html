<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Snoot Cam</title>
<style>
:root{--bg:#fffaf0;--fg:#2b2540;--muted:#5d5675;--accent:#6b3fd4;--card:#ffffff;--line:#e6dfef}
@media (prefers-color-scheme:dark){:root{--bg:#17132a;--fg:#f1edfb;--muted:#b5acd0;--accent:#b79cff;--card:#221c3d;--line:#3a3260}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:40rem;margin:0 auto;padding:1.5rem 1rem 3rem}
h1{font-size:2rem;line-height:1.2;margin:.5rem 0 1rem}
h2{font-size:1.3rem;margin:2rem 0 .5rem}
p,li{margin:.5rem 0}
a{color:var(--accent)}
.muted{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.25rem;margin:1rem 0}
nav{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:1rem}
footer{margin-top:2.5rem;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Snoot Cam</h1>
<p>A simple camera for little ones. Pick a silly face filter, tap the big button, and the photo is saved to the phone.</p>
<div class="card">
<p>No accounts, no ads, no purchases, and no internet connection needed. Snoot Cam collects nothing from you or your child.</p>
</div>
<nav><a href="privacy.html">Privacy Policy</a> <a href="support.html">Support</a></nav>
<footer>&copy; Joseph Lucibello</footer>
</main>
</body>
</html>
